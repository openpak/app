name: openpak
description: OpenPak companion app — your account, friends and invitations.
publish_to: none
version: 0.20.0+36

environment:
  sdk: ^3.9.0

dependencies:
  url_launcher: ^6.3.1
  flutter:
    sdk: flutter
  # The whole dependency list, deliberately. State is three screens of
  # setState and FutureBuilder, so there is no state-management package; the
  # API client is hand-written against openapi.yaml, so there is no dio and no
  # build_runner.
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  # Renders the website's icon.svg as-is. The alternative was redrawing the
  # logo in Dart, which is a copy that drifts the moment the real one changes.
  flutter_svg: ^2.3.0
  # A downloaded save goes to the share sheet: Files, Drive, anywhere, on both platforms.
  share_plus: ^12.0.2
  # An avatar photo from the gallery; the system picker, so no storage permission.
  image_picker: ^1.2.3
  # The app's strings in six languages: Flutter's own gen-l10n, which needs both.
  flutter_localizations:
    sdk: flutter
  intl: any
  # Voice chat: WebRTC audio phone to phone (the server only relays signaling).
  # The signaling socket is dart:io's own WebSocket, so no socket package.
  flutter_webrtc: ^1.6.2+hotfix.3
  # Parental controls open behind the phone's own unlock (fingerprint, face,
  # PIN, pattern), the platform prompt rather than a PIN of the app's own.
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # lib/l10n/*.arb -> AppLocalizations, regenerated on `flutter pub get`.
  generate: true
  assets:
    # A byte-for-byte copy of website/web/static/icon.svg. Refresh with
    # `cp ../website/web/static/icon.svg assets/icon.svg`, then regenerate the
    # launcher icons (see README); a test fails if the two ever differ.
    - assets/icon.svg
    - assets/consoles/
  # The UI face (OFL.txt sits beside the files). Static instances, Latin
  # subset: the site ships the same cut, and a glyph outside it falls back to
  # the system font. See CREDITS.md.
  fonts:
    - family: M PLUS Rounded 1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Medium.ttf
          weight: 500
        - asset: assets/fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: assets/fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800
