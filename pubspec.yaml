name: openpak
description: OpenPak companion app — your account, friends and invitations.
publish_to: none
version: 0.6.17+17

environment:
  sdk: ^3.9.0

dependencies:
  url_launcher: ^6.3.1
  flutter:
    sdk: flutter
  # The whole dependency list, deliberately. State is three screens of
  # setState and FutureBuilder, so there is no state-management package; the
  # API client is hand-written against openapi.yaml, so there is no dio and no
  # build_runner.
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  # Renders the website's icon.svg as-is. The alternative was redrawing the
  # logo in Dart, which is a copy that drifts the moment the real one changes.
  flutter_svg: ^2.3.0
  # A downloaded save goes to the share sheet: Files, Drive, anywhere, on both platforms.
  share_plus: ^12.0.2
  # An avatar photo from the gallery; the system picker, so no storage permission.
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # A byte-for-byte copy of website/web/static/icon.svg. Refresh with
    # `cp ../website/web/static/icon.svg assets/icon.svg`, then regenerate the
    # launcher icons (see README); a test fails if the two ever differ.
    - assets/icon.svg
    - assets/consoles/
