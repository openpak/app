# Tag a release (vX.Y.Z) → build the split-ABI release APKs and attach them to a
# GitHub Release. Sideload builds, debug-signed (README: not a store build yet;
# a real signing config is needed before Play/TestFlight). This is the app's
# "ship on GitHub": installable-by-hand APKs, versioned, off a tag.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release + upload the APKs

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'        # the AGP jlink step fails on newer JDKs

      - uses: android-actions/setup-android@v3
      - name: Android SDK packages (match the project)
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          fail_on_unmatched_files: true
          body: |
            OpenPak companion app ${{ github.ref_name }}.

            Sideload APKs (debug-signed — installable by hand, not a store build).
            Install the one for your device, e.g.:
              adb install app-arm64-v8a-release.apk
