# Tag a release (vX.Y.Z) → build the split-ABI release APKs and attach them to a
# GitHub Release. Signed with the stable OpenPak release key (from repo secrets),
# so each version installs over the last. Sideload builds; a Play/TestFlight
# upload can reuse the same key. This is the app's "ship on GitHub".
name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release + upload the APKs

jobs:
  apk:
    # The OpenPak self-hosted runner: GitHub-hosted minutes are not used for private repositories.
    runs-on: [self-hosted, linux, podman]
    steps:
      - uses: actions/checkout@v5
      # Scratch in the runner's own temp, not the machine's /tmp: /tmp is a RAM
      # disk shared with every other build, and when it filled, the test compiler
      # died and `flutter test` hung for hours instead of failing. Not inside the
      # checkout either: an image build would take it into its context.
      - name: Scratch in the runner's temp, not the machine's shared /tmp
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          echo "TMPDIR=$RUNNER_TEMP/scratch" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'        # the AGP jlink step fails on newer JDKs

      # Only platform-tools: the action's default also asks for the legacy 'tools' package,
      # which current cmdline-tools no longer ship (hosted runners had it preinstalled).
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK packages (match the project)
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — release would be debug-signed and would not update over installed builds."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/openpak-release.jks
          cat > android/key.properties <<EOF
          storeFile=openpak-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # One APK per ABI: armeabi-v7a (ARM 32-bit), arm64-v8a (ARM 64-bit), x86_64. Named so a
      # change in Flutter's defaults can't drop one. 32-bit x86 has no release engine.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      # The runner is a persistent machine: the keystore must not outlive the job.
      - name: Remove signing material
        if: always()
        run: rm -f android/app/openpak-release.jks android/key.properties

      # Whatever the build left in its scratch goes with the job.
      - name: Clear scratch
        if: always()
        run: rm -rf "$RUNNER_TEMP/scratch"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          fail_on_unmatched_files: true
          body: |
            OpenPak companion app ${{ github.ref_name }}.

            Sideload APKs, signed with the OpenPak release key (updates install
            cleanly over previous OpenPak-signed versions).
            Install the one for your device: arm64-v8a (most phones),
            armeabi-v7a (older 32-bit ARM phones), x86_64 (emulators, Chromebooks), e.g.:
              adb install app-arm64-v8a-release.apk
