# Tag a release (vX.Y.Z) → build the split-ABI release APKs and attach them to a
# GitHub Release. Signed with the stable OpenPak release key (from repo secrets),
# so each version installs over the last. Sideload builds; a Play/TestFlight
# upload can reuse the same key. This is the app's "ship on GitHub".
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # create the GitHub Release + upload the APKs

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'        # the AGP jlink step fails on newer JDKs

      - uses: android-actions/setup-android@v3
      - name: Android SDK packages (match the project)
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — release would be debug-signed and would not update over installed builds."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/openpak-release.jks
          cat > android/key.properties <<EOF
          storeFile=openpak-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - run: flutter build apk --release --split-per-abi

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          fail_on_unmatched_files: true
          body: |
            OpenPak companion app ${{ github.ref_name }}.

            Sideload APKs, signed with the OpenPak release key (updates install
            cleanly over previous OpenPak-signed versions).
            Install the one for your device, e.g.:
              adb install app-arm64-v8a-release.apk
