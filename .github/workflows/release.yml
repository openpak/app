# Tag a release (vX.Y.Z) → build the split-ABI release APKs and attach them to a
# GitHub Release. Signed with the stable OpenPak release key (from repo secrets),
# so each version installs over the last. Sideload builds; a Play/TestFlight
# upload can reuse the same key. This is the app's "ship on GitHub".
name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the APKs debug-signed, no signing and no release
        type: boolean
        default: false

permissions:
  contents: write   # create the GitHub Release + upload the APKs

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'        # the AGP jlink step fails on newer JDKs
          cache: gradle

      # Only platform-tools: the action's default also asks for the legacy 'tools' package,
      # which current cmdline-tools no longer ship.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK packages (match the project)
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      # A real release refuses to fall back to the debug key; only a dry run (which
      # publishes nothing) builds debug-signed.
      - name: Set up release signing
        if: env.DRY_RUN != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — release would be debug-signed and would not update over installed builds."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/openpak-release.jks
          cat > android/key.properties <<EOF
          storeFile=openpak-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # One APK per ABI: armeabi-v7a (ARM 32-bit), arm64-v8a (ARM 64-bit), x86_64. Named so a
      # change in Flutter's defaults can't drop one. 32-bit x86 has no release engine.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      # The keystore must not outlive the job.
      - name: Remove signing material
        if: always()
        run: rm -f android/app/openpak-release.jks android/key.properties

      - name: GitHub Release
        if: env.DRY_RUN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-*-release.apk
          fail_on_unmatched_files: true
          body: |
            OpenPak companion app ${{ github.ref_name }}.

            Sideload APKs, signed with the OpenPak release key (updates install
            cleanly over previous OpenPak-signed versions).
            Install the one for your device: arm64-v8a (most phones),
            armeabi-v7a (older 32-bit ARM phones), x86_64 (emulators, Chromebooks), e.g.:
              adb install app-arm64-v8a-release.apk
